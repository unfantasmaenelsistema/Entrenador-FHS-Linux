<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background Canvas -->
  <rect width="1280" height="780" fill="#0B0F17" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1280" height="54" fill="#0E131D" />
  <line x1="0" y1="54" x2="1280" y2="54" stroke="#232D3F" stroke-width="1" />
  <rect x="24" y="11" width="32" height="32" rx="6" fill="#161E2E" stroke="#2A364F" />
  <circle cx="40" cy="27" r="9" fill="#E6EDF3" />
  <circle cx="38" cy="26" r="3" fill="#0B0F17" />
  <circle cx="43" cy="26" r="3" fill="#0B0F17" />
  <text x="68" y="32" fill="#FFFFFF" font-size="15" font-weight="700">Entrenador FHS Linux</text>

  <!-- Nav Tabs -->
  <text x="360" y="32" fill="#FFFFFF" font-size="13" font-weight="600">Simulador FHS (16 Casos)</text>
  <line x1="360" y1="44" x2="522" y2="44" stroke="#34D399" stroke-width="2" />
  <text x="554" y="32" fill="#94A3B8" font-size="13" font-weight="500">Particiones y Montajes</text>
  <text x="724" y="32" fill="#94A3B8" font-size="13" font-weight="500">Matriz FHS 3.0</text>
  <text x="845" y="32" fill="#94A3B8" font-size="13" font-weight="500">Test LPIC-1 e Informe</text>

  <!-- CTA Button -->
  <rect x="1062" y="13" width="194" height="28" rx="6" fill="#34D399" />
  <text x="1078" y="31" fill="#020617" font-size="12" font-weight="700">Un Fantasma en el Sistema ↗</text>

  <!-- Active Incident Briefing Card -->
  <rect x="24" y="70" width="1232" height="128" rx="8" fill="#111722" stroke="#232D3F" />
  <text x="42" y="94" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">INCIDENCIA #01  ·  Almacenamiento y Logs  ·  Nivel Básico  ·  Control de Rama Lógica: Activo</text>
  <text x="42" y="118" fill="#FFFFFF" font-size="16" font-weight="700">Un log descontrolado ha llenado el disco al 99%</text>
  <text x="42" y="140" fill="#CBD5E1" font-size="12">Alerta crítica de monitorización: La partición raíz (/) está al 99% de capacidad (solo quedan 112 MB libres). Un demonio en bucle escribe errores.</text>
  <text x="42" y="160" fill="#6EE7B7" font-size="12" font-weight="600">Objetivo: Navega desde la raíz (/) sin salirte de la rama lógica de datos variables hasta localizar el archivo de registro de 42.8 GB.</text>
  <line x1="42" y1="170" x2="1238" y2="170" stroke="#232D3F" />
  <text x="42" y="187" fill="#94A3B8" font-family="monospace" font-size="11">Traza de navegación:  /  →  /var  →  /var/log  →  /var/log/syslog   (Desvíos de rama lógica: 0)</text>

  <!-- Validate Button -->
  <rect x="968" y="86" width="270" height="34" rx="6" fill="#34D399" />
  <text x="988" y="107" fill="#020617" font-size="12" font-weight="700">✓ Validar Ruta (/var/log/syslog)</text>

  <!-- 3-Column Workbench -->
  <!-- Column 1: FHS 3.0 Tree Explorer -->
  <rect x="24" y="212" width="290" height="390" rx="8" fill="#111722" stroke="#232D3F" />
  <rect x="24" y="212" width="290" height="42" rx="8" fill="#0E131D" />
  <line x1="24" y1="254" x2="314" y2="254" stroke="#232D3F" />
  <text x="38" y="232" fill="#E2E8F0" font-size="12" font-weight="600">Árbol Jerárquico FHS 3.0</text>
  <text x="38" y="246" fill="#64748B" font-size="10">Haz clic para navegar sin salirte de la rama</text>
  <text x="234" y="236" fill="#34D399" font-family="monospace" font-size="10">ext4 / procfs</text>

  <!-- Tree Items -->
  <g font-family="monospace" font-size="12">
    <text x="38" y="276" fill="#E2E8F0">▾ 📂 / (raíz)</text>
    <text x="54" y="298" fill="#94A3B8">▸ 📁 bin → /usr/bin</text>
    <text x="54" y="320" fill="#94A3B8">▸ 📁 boot</text>
    <text x="54" y="342" fill="#94A3B8">▸ 💽 dev</text>
    <text x="54" y="364" fill="#94A3B8">▸ 📁 etc</text>
    <text x="54" y="386" fill="#94A3B8">▸ 📁 home</text>
    <text x="54" y="408" fill="#94A3B8">▸ 📁 mnt</text>
    <text x="54" y="430" fill="#38BDF8">▸ ⚙️ proc (RAM)</text>
    <text x="54" y="452" fill="#94A3B8">▸ 📁 usr</text>
    <rect x="30" y="460" width="278" height="22" rx="4" fill="#1E293B" />
    <text x="54" y="475" fill="#F8FAFC" font-weight="600">▾ 📂 var</text>
    <rect x="30" y="484" width="278" height="22" rx="4" fill="#1E293B" />
    <text x="72" y="499" fill="#F8FAFC" font-weight="600">▾ 📂 log</text>
    <rect x="30" y="508" width="278" height="24" rx="4" fill="#064E3B" />
    <text x="90" y="524" fill="#6EE7B7" font-weight="700">📄 syslog</text>
    <text x="260" y="524" fill="#FB7185" font-size="11" font-weight="700">42.8G</text>
    <text x="90" y="546" fill="#94A3B8">📄 auth.log</text>
    <text x="90" y="568" fill="#94A3B8">▸ 📁 nginx</text>
    <text x="72" y="590" fill="#94A3B8">▸ 📁 lib</text>
  </g>

  <!-- Column 2: Directory Explorer (ls -la) -->
  <rect x="328" y="212" width="496" height="390" rx="8" fill="#111722" stroke="#232D3F" />
  <rect x="328" y="212" width="496" height="42" rx="8" fill="#0E131D" />
  <line x1="328" y1="254" x2="824" y2="254" stroke="#232D3F" />
  <text x="344" y="237" fill="#64748B" font-family="monospace" font-size="12">pwd:</text>
  <text x="380" y="237" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="700">/  /  var  /  log</text>
  <rect x="716" y="221" width="54" height="24" rx="4" fill="#161E2E" />
  <text x="726" y="237" fill="#E2E8F0" font-family="monospace" font-size="11">cd ..</text>
  <rect x="776" y="221" width="34" height="24" rx="4" fill="#161E2E" />
  <text x="790" y="237" fill="#E2E8F0" font-family="monospace" font-size="11">/</text>

  <!-- Table Header -->
  <rect x="329" y="255" width="494" height="28" fill="#0B0F17" />
  <text x="344" y="273" fill="#94A3B8" font-family="monospace" font-size="11">Permisos</text>
  <text x="454" y="273" fill="#94A3B8" font-family="monospace" font-size="11">Propietario</text>
  <text x="574" y="273" fill="#94A3B8" font-family="monospace" font-size="11">Tamaño</text>
  <text x="648" y="273" fill="#94A3B8" font-family="monospace" font-size="11">Nombre</text>
  <line x1="328" y1="283" x2="824" y2="283" stroke="#232D3F" />

  <!-- Table Rows -->
  <g font-family="monospace" font-size="12">
    <text x="344" y="308" fill="#64748B">drwxr-xr-x</text>
    <text x="454" y="308" fill="#64748B">root:root</text>
    <text x="580" y="308" fill="#64748B">4.0K</text>
    <text x="648" y="308" fill="#38BDF8" font-weight="600">.. (Subir nivel)</text>
    <line x1="328" y1="320" x2="824" y2="320" stroke="#1A2232" />

    <!-- Selected Row: syslog -->
    <rect x="329" y="321" width="494" height="36" fill="#064E3B" fill-opacity="0.45" />
    <text x="344" y="344" fill="#CBD5E1">-rw-r-----</text>
    <text x="454" y="344" fill="#CBD5E1">syslog:adm</text>
    <text x="572" y="344" fill="#FB7185" font-weight="700">42.8G</text>
    <text x="648" y="344" fill="#FFFFFF" font-weight="700">📄 syslog</text>
    <line x1="328" y1="357" x2="824" y2="357" stroke="#1A2232" />

    <!-- Row: auth.log -->
    <text x="344" y="382" fill="#94A3B8">-rw-r-----</text>
    <text x="454" y="382" fill="#94A3B8">syslog:adm</text>
    <text x="580" y="382" fill="#CBD5E1">4.2M</text>
    <text x="648" y="382" fill="#E2E8F0">📄 auth.log</text>
    <line x1="328" y1="395" x2="824" y2="395" stroke="#1A2232" />

    <!-- Row: nginx/ -->
    <text x="344" y="420" fill="#94A3B8">drwxr-xr-x</text>
    <text x="454" y="420" fill="#94A3B8">www-data:adm</text>
    <text x="580" y="420" fill="#CBD5E1">4.0K</text>
    <text x="648" y="420" fill="#6EE7B7" font-weight="600">📁 nginx/</text>
    <line x1="328" y1="433" x2="824" y2="433" stroke="#1A2232" />
  </g>

  <!-- Column 3: Inode & POSIX Permission Inspector -->
  <rect x="838" y="212" width="418" height="390" rx="8" fill="#111722" stroke="#232D3F" />
  <rect x="838" y="212" width="418" height="42" rx="8" fill="#0E131D" />
  <line x1="838" y1="254" x2="1256" y2="254" stroke="#232D3F" />
  <text x="854" y="232" fill="#E2E8F0" font-size="12" font-weight="600">Inspector de Inodo, Permisos y Estándar FHS</text>
  <text x="854" y="247" fill="#34D399" font-family="monospace" font-size="11">/var/log/syslog (Inodo #1711)</text>
  <text x="1172" y="238" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">chmod 0640</text>

  <!-- Metadata Strip -->
  <text x="854" y="276" fill="#94A3B8" font-family="monospace" font-size="11">Variable  ·  No compartible  ·  syslog:adm  ·  42.8G</text>
  <line x1="854" y1="286" x2="1240" y2="286" stroke="#232D3F" />

  <!-- POSIX Box -->
  <rect x="854" y="296" width="386" height="68" rx="6" fill="#0B0F17" stroke="#232D3F" />
  <text x="866" y="314" fill="#CBD5E1" font-size="11" font-weight="600">🔒 Desglose de Permisos POSIX</text>
  <text x="1152" y="314" fill="#6EE7B7" font-family="monospace" font-size="11">Octal: 0640</text>
  <rect x="866" y="322" width="84" height="34" rx="4" fill="#111722" stroke="#1E2636" />
  <text x="904" y="338" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">-</text>
  <text x="895" y="351" fill="#94A3B8" font-size="9">Tipo</text>
  <rect x="958" y="322" width="88" height="34" rx="4" fill="#111722" stroke="#1E2636" />
  <text x="990" y="338" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="700">rw-</text>
  <text x="984" y="351" fill="#94A3B8" font-size="9">User (u)</text>
  <rect x="1054" y="322" width="88" height="34" rx="4" fill="#111722" stroke="#1E2636" />
  <text x="1086" y="338" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">r--</text>
  <text x="1076" y="351" fill="#94A3B8" font-size="9">Group (g)</text>
  <rect x="1150" y="322" width="78" height="34" rx="4" fill="#111722" stroke="#1E2636" />
  <text x="1178" y="338" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">---</text>
  <text x="1168" y="351" fill="#94A3B8" font-size="9">Others (o)</text>

  <!-- FHS Description & Cat Preview -->
  <text x="854" y="384" fill="#FFFFFF" font-size="12" font-weight="600">Función en la Jerarquía Linux (FHS 3.0)</text>
  <text x="854" y="402" fill="#CBD5E1" font-size="11">Registra cronológicamente los mensajes globales del sistema.</text>
  <text x="854" y="418" fill="#CBD5E1" font-size="11">Para vaciarlo en vivo sin cerrar el inodo: truncate -s 0</text>

  <rect x="854" y="432" width="386" height="154" rx="6" fill="#080B11" stroke="#232D3F" />
  <text x="866" y="452" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="600">$ cat /var/log/syslog</text>
  <text x="866" y="474" fill="#A7F3D0" font-family="monospace" font-size="10">Nov 03 08:42:01 lab-fhs rsyslogd: file '/var/log/syslog'</text>
  <text x="866" y="490" fill="#A7F3D0" font-family="monospace" font-size="10">sizereached 42.8GB</text>
  <text x="866" y="510" fill="#FDA4AF" font-family="monospace" font-size="10">Nov 03 08:42:01 sensor-loop[1922]: ERROR: Connection</text>
  <text x="866" y="526" fill="#FDA4AF" font-family="monospace" font-size="10">timeout retrying in 1ms (repeated 84,920,114 times)</text>
  <text x="866" y="546" fill="#FDE047" font-family="monospace" font-size="10">Nov 03 08:42:02 systemd[1]: Disk space on / critically</text>
  <text x="866" y="562" fill="#FDE047" font-family="monospace" font-size="10">low (99% used - only 112MB free)</text>

  <!-- Bottom Synchronized Interactive Linux Terminal -->
  <rect x="24" y="614" width="1232" height="146" rx="8" fill="#080B11" stroke="#232D3F" />
  <rect x="24" y="614" width="1232" height="32" rx="8" fill="#0E131D" />
  <line x1="24" y1="646" x2="1256" y2="646" stroke="#232D3F" />
  <text x="42" y="634" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">root@lab-fhs:/var/log#</text>
  <text x="220" y="634" fill="#94A3B8" font-size="11">· Autocompletado con TAB · Historial con ↑/↓ · Sincronizada con el árbol</text>

  <g font-family="monospace" font-size="12">
    <text x="42" y="668" fill="#34D399">root@lab-fhs:/var/log# <tspan fill="#F8FAFC">du -sh /var/log/*</tspan></text>
    <text x="54" y="688" fill="#CBD5E1">42.8G   /var/log/syslog       4.2M   /var/log/auth.log       18.4K   /var/log/nginx/error.log</text>
    <text x="42" y="712" fill="#34D399">root@lab-fhs:/var/log# <tspan fill="#F8FAFC">truncate -s 0 /var/log/syslog</tspan></text>
    <text x="54" y="732" fill="#6EE7B7" font-weight="600">[OK] Archivo /var/log/syslog truncado en vivo de 42.8G a 0B. Espacio en / recuperado (uso actual: 14%).</text>
  </g>
</svg>
